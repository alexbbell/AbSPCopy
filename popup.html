<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f2f1;
      color: #323130;
    }
    .tabs {
      display: flex;
      background-color: #ffffff;
      border-bottom: 1px solid #edebe9;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #605e5c;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      background-color: #f3f2f1;
      color: #0078d4;
    }
    .tab-btn.active {
      color: #0078d4;
      border-bottom: 3px solid #0078d4;
    }
    .tab-content {
      display: none;
      padding: 16px;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #484644;
    }
    input[type="text"], textarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #a19f9d;
      border-radius: 2px;
      padding: 8px;
      font-size: 13px;
      background-color: #ffffff;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #0078d4;
      outline: none;
    }
    textarea {
      height: 140px;
      resize: none;
      font-family: Courier, monospace;
      font-size: 11px;
    }
    button.action-btn {
      width: 100%;
      background-color: #0078d4;
      color: #ffffff;
      border: none;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 2px;
      cursor: pointer;
    }
    button.action-btn:hover {
      background-color: #106ebe;
    }
    .status {
      margin: 12px 16px;
      padding: 8px 12px;
      border-radius: 2px;
      font-size: 12px;
      font-weight: 500;
      display: none;
    }
    .status.info { display: block; background-color: #edf2f7; color: #2b6cb0; border-left: 3px solid #2b6cb0; }
    .status.success { display: block; background-color: #d4edda; color: #155724; border-left: 3px solid #28a745; }
    .status.error { display: block; background-color: #f8d7da; color: #721c24; border-left: 3px solid #dc3545; }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" id="tab-export">Export List</button>
    <button class="tab-btn" id="tab-import">Import List</button>
  </div>

  <div id="status" class="status"></div>

  <div id="content-export" class="tab-content active">
    <p style="font-size: 13px; margin-top: 0; color: #605e5c;">
      Navigate to your source SharePoint <b>List Settings</b> page, then click below to scrape its columns.
    </p>
    <button id="copyBtn" class="action-btn">Copy Current List Columns</button>
  </div>

  <div id="content-import" class="tab-content">
    <div class="form-group">
      <label for="listTitle">New List Title</label>
      <input type="text" id="listTitle" placeholder="e.g., Cloned Project Tracker">
    </div>
    <div class="form-group">
      <label for="jsonInput">Columns Configuration JSON</label>
      <textarea id="jsonInput" placeholder='Paste your copied column array JSON here...'></textarea>
    </div>
    <button id="createBtn" class="action-btn">Create List & Columns</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
